name: Release

on:
  release:
    types: [created]

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Get release version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG, version: $VERSION"

      - name: Build and Pack
        uses: ./.github/actions/build-and-pack
        with:
          version: ${{ steps.version.outputs.version }}

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Get release version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG, version: $VERSION"

  build-windows:
    needs: version
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Build and Pack (win-x64)
        uses: ./.github/actions/build-and-pack
        with:
          version: ${{ needs.version.outputs.version }}
          rids: win-x64

      - name: Package MSI (win-x64)
        uses: ./.github/actions/package-windows-msi
        with:
          version: ${{ needs.version.outputs.version }}
          rid: win-x64

      - name: Upload build artifacts (Windows ZIP)
        uses: actions/upload-artifact@main
        with:
          name: release-${{ needs.version.outputs.version }}-windows-x64
          path: FrapaClonia-${{ needs.version.outputs.version }}-windows-x64.zip
          retention-days: 7

      - name: Upload build artifacts (Windows MSI)
        uses: actions/upload-artifact@main
        with:
          name: release-${{ needs.version.outputs.version }}-windows-x64-installer
          path: FrapaClonia-${{ needs.version.outputs.version }}-windows-x64-installer.msi
          retention-days: 7

  build-linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Build and Pack (Linux)
        uses: ./.github/actions/build-and-pack
        with:
          version: ${{ needs.version.outputs.version }}
          rids: linux-x64 linux-arm64 linux-musl-x64 linux-musl-arm64

      - name: Package DEB (Debian linux)
        uses: ./.github/actions/package-linux-deb
        with:
          version: ${{ needs.version.outputs.version }}
          publish_root: out
          rids: linux-x64 linux-arm64

      - name: Upload build artifacts (linux-x64)
        uses: actions/upload-artifact@main
        with:
          name: release-${{ needs.version.outputs.version }}-linux-x64
          path: FrapaClonia-${{ needs.version.outputs.version }}-linux-x64.tar.gz
          retention-days: 7

      - name: Upload build artifacts (linux-x64 DEB)
        uses: actions/upload-artifact@main
        with:
          name: release-${{ needs.version.outputs.version }}-linux-x64-deb
          path: FrapaClonia-${{ needs.version.outputs.version }}-linux-x64.deb
          retention-days: 7

      - name: Upload build artifacts (linux-arm64)
        uses: actions/upload-artifact@main
        with:
          name: release-${{ needs.version.outputs.version }}-linux-arm64
          path: FrapaClonia-${{ needs.version.outputs.version }}-linux-arm64.tar.gz
          retention-days: 7

      - name: Upload build artifacts (linux-arm64 DEB)
        uses: actions/upload-artifact@main
        with:
          name: release-${{ needs.version.outputs.version }}-linux-arm64-deb
          path: FrapaClonia-${{ needs.version.outputs.version }}-linux-arm64.deb
          retention-days: 7

      - name: Upload build artifacts (linux-musl-x64)
        uses: actions/upload-artifact@main
        with:
          name: release-${{ needs.version.outputs.version }}-linux-musl-x64
          path: FrapaClonia-${{ needs.version.outputs.version }}-linux-musl-x64.tar.gz
          retention-days: 7

      - name: Upload build artifacts (linux-musl-arm64)
        uses: actions/upload-artifact@main
        with:
          name: release-${{ needs.version.outputs.version }}-linux-musl-arm64
          path: FrapaClonia-${{ needs.version.outputs.version }}-linux-musl-arm64.tar.gz
          retention-days: 7

  build-macos:
    needs: version
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Build and Pack (macOS)
        uses: ./.github/actions/build-and-pack
        with:
          version: ${{ needs.version.outputs.version }}
          rids: osx-x64 osx-arm64

      - name: Create DMG from macOS zips
        uses: ./.github/actions/package-macos-dmg
        with:
          version: ${{ needs.version.outputs.version }}
          publish_root: out
          icon_icns: assets/images/favicon.icns
          output_dir: .

      - name: Upload DMG artifacts
        uses: actions/upload-artifact@main
        with:
          name: release-${{ needs.version.outputs.version }}-macos-x64-dmg
          path: FrapaClonia-${{ needs.version.outputs.version }}-macos-x64.dmg
          retention-days: 7

      - name: Upload DMG artifacts (arm64)
        uses: actions/upload-artifact@main
        with:
          name: release-${{ needs.version.outputs.version }}-macos-arm64-dmg
          path: FrapaClonia-${{ needs.version.outputs.version }}-macos-arm64.dmg
          retention-days: 7

  upload-release-assets:
    needs: [version, build-windows, build-linux, build-macos]
    if: ${{ !cancelled() && needs.version.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Download build assets
        uses: actions/download-artifact@main
        with:
          pattern: release-${{ needs.version.outputs.version }}-*
          path: dist
          merge-multiple: true

      - name: Upload Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.version.outputs.tag }}"
          VERSION="${{ needs.version.outputs.version }}"
          shopt -s nullglob
          files=(dist/FrapaClonia-${VERSION}-*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No release assets found in dist/"
            exit 1
          fi
          echo "Uploading ${#files[@]} file(s): ${files[*]}"
          gh release upload "$TAG" "${files[@]}" --clobber
