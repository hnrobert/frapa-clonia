name: "Package Windows MSI"
description: "Build MSI installer for Windows using WiX Toolset"

inputs:
  version:
    description: "Version string for the MSI"
    required: true

  publish_root:
    description: "Root directory containing published outputs"
    required: false
    default: "out"

  rid:
    description: "Runtime identifier (e.g. win-x64)"
    required: false
    default: "win-x64"

  app_name:
    description: "Application name"
    required: false
    default: "FrapaClonia"

runs:
  using: "composite"
  steps:
    - name: Install WiX Toolset
      shell: pwsh
      run: dotnet tool install --global wix

    - name: Generate Components.wxs from published files
      shell: pwsh
      run: |
        $SourceDir = "${{ inputs.publish_root }}/${{ inputs.rid }}"
        $Files = Get-ChildItem -Path $SourceDir -File -Recurse
        $Id = 0

        $Wxs = @(
          '<Wix xmlns="http://wixtoolset.org/schemas/v4/wxs">'
          '<Fragment>'
          '<ComponentGroup Id="AppComponents">'
        )

        foreach ($File in $Files) {
          $Id++
          $RelPath = $File.FullName.Substring($SourceDir.Length).TrimStart('\','/')
          $FileId = "File_$Id"
          $CompId = "Comp_$Id"
          $EscapedRelPath = $RelPath -replace '\\','/' -replace '([&<>])','&$1'

          $Wxs += @"
            <Component Id="$CompId" Directory="INSTALLFOLDER">
              <File Id="$FileId" Source="$(var.SourceDir)/$EscapedRelPath" />
            </Component>
"@
        }

        $Wxs += @(
          '</ComponentGroup>'
          '</Fragment>'
          '</Wix>'
        )

        $Wxs | Set-Content -Path "Components.wxs" -Encoding UTF8
        Write-Host "Generated Components.wxs with $($Files.Count) files"

    - name: Build MSI
      shell: pwsh
      run: |
        $Version = '${{ inputs.version }}'
        $Rid = '${{ inputs.rid }}'
        $AppName = '${{ inputs.app_name }}'
        $SourceDir = "${{ inputs.publish_root }}/$Rid"
        $Output = "${AppName}-${Version}-${Rid}.msi"

        wix build `
          Assets/manifests/installer.wxs `
          Components.wxs `
          -d Version=$Version `
          -d SourceDir=$SourceDir `
          -o $Output

        Write-Host "Built MSI: $Output"
